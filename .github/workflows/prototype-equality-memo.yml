name: Prototype reusable equality memo

on:
  push:
    branches:
      - ci/reuse-equality-memo-prototype

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Apply prototype source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/hashconsing.jl")
          text = path.read_text()

          old = (
              "const EQUALITY_MEMO =\n"
              "    TaskLocalValue{Union{Nothing, Dict{Tuple{UInt, UInt, Bool}, Bool}}}(Returns(nothing))\n"
          )
          new = (
              old
              + "const EQUALITY_MEMO_CACHE =\n"
              + "    TaskLocalValue{Dict{Tuple{UInt, UInt, Bool}, Bool}}(Dict{Tuple{UInt, UInt, Bool}, Bool})\n"
          )
          if text.count(old) != 1:
              raise SystemExit("EQUALITY_MEMO declaration pattern did not match exactly once")
          text = text.replace(old, new)

          old = (
              "    # Only the outermost comparison sets the memo up; nested ones reuse it as they are.\n"
              "    EQUALITY_MEMO[] === nothing || return isequal_bsimpl(a, b, COMPARE_FULL[])\n"
              "    EQUALITY_MEMO[] = Dict{Tuple{UInt, UInt, Bool}, Bool}()\n"
              "    try\n"
              "        return isequal_bsimpl(a, b, COMPARE_FULL[])\n"
              "    finally\n"
              "        EQUALITY_MEMO[] = nothing\n"
              "    end\n"
          )
          new = (
              "    # Only the outermost comparison sets the memo up; nested ones reuse it as they are.\n"
              "    EQUALITY_MEMO[] === nothing || return isequal_bsimpl(a, b, COMPARE_FULL[])\n"
              "    memo = EQUALITY_MEMO_CACHE[]\n"
              "    EQUALITY_MEMO[] = memo\n"
              "    try\n"
              "        return isequal_bsimpl(a, b, COMPARE_FULL[])\n"
              "    finally\n"
              "        EQUALITY_MEMO[] = nothing\n"
              "        empty!(memo)\n"
              "    end\n"
          )
          if text.count(old) != 1:
              raise SystemExit("Base.isequal memo block pattern did not match exactly once")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- src/hashconsing.jl

      - name: Instantiate
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Equality regression probes
        run: |
          julia --project=. - <<'JULIA'
          using SymbolicUtils
          using Test

          struct EqualityMemoTag end
          @syms x::Real y::Real a b c d

          function deep(leaf, n)
              e = leaf
              for i in 1:n
                  e = (e + i) * (e + y)
              end
              return e
          end

          tagged = SymbolicUtils.setmetadata(x, EqualityMemoTag, 1)
          lhs = deep(x, 100)
          rhs = deep(tagged, 100)
          @test isequal(lhs, rhs)
          deep_time = @elapsed @test isequal(lhs, rhs)
          println("#1049 depth=100 equality time: ", deep_time, " s")

          function build_deep_expr(vars, depth)
              expr = vars[1]
              for i in 1:depth
                  v = vars[mod1(i, length(vars))]
                  expr = sin(expr * v + v^2 - v)
              end
              return expr
          end

          function batch_isequal(xs, ys, reps)
              acc = true
              n = length(xs)
              for i in 1:reps
                  acc &= isequal(xs[mod1(i, n)], ys[mod1(i, n)])
              end
              return acc
          end

          exprs1 = [build_deep_expr([a, b, c, d], 300) for _ in 1:16]
          exprs2 = [build_deep_expr([b, c, d, a], 300) for _ in 1:16]
          batch_isequal(exprs1, exprs2, 2000)
          batch_isequal(exprs1, exprs2, 2000)

          function measured_batch(xs, ys)
              bytes = @allocated batch_isequal(xs, ys, 2000)
              time = @elapsed batch_isequal(xs, ys, 2000)
              return bytes, time
          end
          bytes, elapsed = measured_batch(exprs1, exprs2)
          println("overhead/isequal/different after warmup: bytes=", bytes, " time=", elapsed, " s")
          @test bytes == 0
          JULIA

      - name: Package tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'
