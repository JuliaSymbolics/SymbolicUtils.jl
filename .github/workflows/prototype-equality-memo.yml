name: Materialize reusable equality memo prototype

on:
  push:
    branches:
      - ci/reuse-equality-memo-prototype

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply validated source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/hashconsing.jl")
          text = path.read_text()
          if "const EQUALITY_MEMO_CACHE =" in text:
              raise SystemExit(0)

          old = (
              "const EQUALITY_MEMO =\n"
              "    TaskLocalValue{Union{Nothing, Dict{Tuple{UInt, UInt, Bool}, Bool}}}(Returns(nothing))\n"
          )
          new = (
              old
              + "const EQUALITY_MEMO_CACHE =\n"
              + "    TaskLocalValue{Dict{Tuple{UInt, UInt, Bool}, Bool}}(Dict{Tuple{UInt, UInt, Bool}, Bool})\n"
          )
          if text.count(old) != 1:
              raise SystemExit("EQUALITY_MEMO declaration pattern did not match exactly once")
          text = text.replace(old, new)

          old = (
              "    # Only the outermost comparison sets the memo up; nested ones reuse it as they are.\n"
              "    EQUALITY_MEMO[] === nothing || return isequal_bsimpl(a, b, COMPARE_FULL[])\n"
              "    EQUALITY_MEMO[] = Dict{Tuple{UInt, UInt, Bool}, Bool}()\n"
              "    try\n"
              "        return isequal_bsimpl(a, b, COMPARE_FULL[])\n"
              "    finally\n"
              "        EQUALITY_MEMO[] = nothing\n"
              "    end\n"
          )
          new = (
              "    # Only the outermost comparison sets the memo up; nested ones reuse it as they are.\n"
              "    EQUALITY_MEMO[] === nothing || return isequal_bsimpl(a, b, COMPARE_FULL[])\n"
              "    memo = EQUALITY_MEMO_CACHE[]\n"
              "    EQUALITY_MEMO[] = memo\n"
              "    try\n"
              "        return isequal_bsimpl(a, b, COMPARE_FULL[])\n"
              "    finally\n"
              "        EQUALITY_MEMO[] = nothing\n"
              "        empty!(memo)\n"
              "    end\n"
          )
          if text.count(old) != 1:
              raise SystemExit("Base.isequal memo block pattern did not match exactly once")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit source blob
        run: |
          if git diff --quiet -- src/hashconsing.jl; then
            echo "source already materialized"
            exit 0
          fi
          git config user.name "Orjan Ameye"
          git config user.email "orjan.ameye@hotmail.com"
          git add src/hashconsing.jl
          git commit -m "perf: reuse BasicSymbolic equality memo [skip ci]"
          git push origin HEAD:ci/reuse-equality-memo-prototype
